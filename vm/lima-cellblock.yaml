# Lima VM for cellblock development on Apple silicon.
# Namespaces, cgroups v2 and seccomp need a Linux kernel; nested virtualization
# (M3+, macOS 15+) exposes /dev/kvm for the Phase 3 Firecracker backend.
vmType: vz
nestedVirtualization: true
cpus: 4
memory: 8GiB
disk: 30GiB
images:
  - location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
mounts:
  - location: "~/Code/GitHub-Repos/cellblock"
    writable: true
mountType: virtiofs
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential pkg-config busybox-static curl
  - mode: user
    script: |
      #!/bin/bash
      set -eux
      command -v cargo || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
