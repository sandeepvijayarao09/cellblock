[package]
name = "cellblock"
version = "0.1.0"
edition = "2021"
description = "Run untrusted code in a Linux namespace jail with cgroups v2 limits and a seccomp-bpf allowlist"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
nix = { version = "0.31.3", features = ["sched", "mount", "hostname", "user", "fs", "signal", "process", "resource", "poll"] }
seccompiler = "0.5.0"

[[bin]]
name = "cellblock"
path = "src/main.rs"

[[bin]]
name = "cellblock-bench"
path = "src/bin/bench.rs"

[profile.release]
debug = false
lto = true
codegen-units = 1
